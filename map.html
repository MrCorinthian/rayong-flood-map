<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>แผนที่น้ำท่วมจังหวัดระยอง — Rayong Flood Map</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23d32f2f%22 stroke=%22%23fff%22 stroke-width=%221.5%22/%3E%3C/svg%3E">
  <meta name="description" content="แผนที่จุดน้ำท่วมจังหวัดระยอง รวบรวมจากโพสต์สาธารณะ อัปเดตอัตโนมัติทุก 5 นาที">
  <!-- Leaflet 1.9.4 (pinned). SRI sha384 verified 2026-09-29 against both unpkg and cdnjs copies. No API key needed. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin=""></script>
  <style>
    /* Severity colours mirror config/settings.json -> marker_colors (keep in sync). */
    :root {
      --severe: #d32f2f; --moderate: #f57c00; --minor: #fbc02d; --unknown: #757575; --none: #388e3c;
      --ink: #1f2328; --muted: #5f6b76; --line: #e6e8eb;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: "Sarabun", "Noto Sans Thai", "Leelawadee UI", Tahoma, system-ui, sans-serif; color: var(--ink); }
    #map { position: absolute; inset: 0; background: #e8eef1; }

    /* ---------- info panel ---------- */
    #panel {
      position: absolute; z-index: 1000; top: 10px; left: 10px; width: 312px; max-height: calc(100% - 20px); overflow: auto;
      background: rgba(255,255,255,.97); border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,.22), 0 1px 3px rgba(0,0,0,.18);
      padding: 11px 13px; font-size: 13.5px; line-height: 1.45;
    }
    #panel h1 { font-size: 16px; margin: 0 0 4px; }
    #updated { font-weight: 600; }
    #summary, #checked { color: var(--muted); font-size: 12.5px; }
    #error { display: none; color: #b00020; font-size: 12.5px; margin-top: 4px; }
    details { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 4px; }
    summary { cursor: pointer; font-weight: 600; padding: 4px 0; list-style-position: inside; }
    .disclaimer { margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }

    /* ---------- legend (built by JS from the same SVG code as the markers) ---------- */
    .lg-h { font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .02em; margin: 8px 0 3px; }
    .lg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
    .lg { display: flex; align-items: center; gap: 8px; margin: 2px 0; min-height: 26px; font-size: 13px; }
    .lg .sw { flex: 0 0 30px; height: 30px; display: flex; align-items: center; justify-content: center; position: relative; }
    .lg .sw .rf-mk { position: relative; }
    .lg .area { width: 30px; height: 30px; border-radius: 50%; border: 1.5px dashed rgba(117,117,117,.8);
                background: rgba(117,117,117,.14); display: flex; align-items: center; justify-content: center; }
    .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff;
           box-shadow: 0 0 0 .5px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.35); flex: 0 0 auto; }

    /* ---------- markers ---------- */
    .rf-icon { background: none; border: none; }
    .rf-mk { position: relative; display: block; }
    .rf-mk svg { display: block; overflow: visible;
                 filter: drop-shadow(0 0 .6px rgba(0,0,0,.55)) drop-shadow(0 2px 2.5px rgba(0,0,0,.38)); }
    .rf-mk.is-stale { opacity: .6; filter: grayscale(.35); }
    .rf-cnt {
      position: absolute; top: -5px; right: -7px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px;
      background: #fff; color: var(--ink); border: 1.5px solid var(--c, #555); font: 700 10.5px/14px system-ui, sans-serif;
      text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,.35); pointer-events: none;
    }
    .rf-pulse {
      position: absolute; border-radius: 50%; background: var(--c, #d32f2f); pointer-events: none;
      animation: rfPulse 2.2s ease-out infinite; transform-origin: 50% 50%;
    }
    @keyframes rfPulse { 0% { transform: scale(.85); opacity: .55; } 75%, 100% { transform: scale(2.5); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .rf-pulse { animation: none; transform: scale(1.6); opacity: .22; } }
    .leaflet-marker-icon.rf-icon:focus-visible { outline: 3px solid #1a73e8; outline-offset: 2px; border-radius: 50%; }

    /* ---------- popup ---------- */
    .rf-popup .leaflet-popup-content-wrapper { padding: 0; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 22px rgba(0,0,0,.28); }
    .rf-popup .leaflet-popup-content { margin: 0; width: auto !important; min-width: 250px; }
    .rf-popup a.leaflet-popup-close-button { top: 6px; right: 6px; width: 26px; height: 26px; font: 20px/24px Tahoma, sans-serif;
      border-radius: 50%; background: rgba(255,255,255,.85); color: #444; text-align: center; }
    .pp { font-size: 13.5px; line-height: 1.45; }
    .pp-head { display: flex; gap: 10px; align-items: flex-start; padding: 11px 38px 10px 12px;
               background: #f4f5f7; background: color-mix(in srgb, var(--c) 13%, #fff); border-bottom: 3px solid var(--c); }
    .pp-head .rf-mk { flex: 0 0 auto; margin-top: 1px; }
    .pp h3 { font-size: 15px; margin: 0 0 2px; line-height: 1.35; }
    .pp .loc { color: #444c56; font-size: 12.5px; }
    .pp-body { padding: 8px 12px 11px; }
    .pp .note { background: #fff4e5; border-left: 3px solid #f57c00; padding: 4px 8px; margin: 0 0 6px; font-size: 12.5px; border-radius: 0 6px 6px 0; }
    .pp .note.stale { background: #f0f1f2; border-color: #888; }
    .pp .note.priv { background: #eef3ff; border-color: #3f51b5; }
    .pp table { border-collapse: collapse; width: 100%; }
    .pp th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12.5px; padding: 4px 10px 4px 0; vertical-align: middle; white-space: nowrap; }
    .pp td { padding: 4px 0; vertical-align: middle; }
    .pp tr + tr th, .pp tr + tr td { border-top: 1px solid #f0f1f3; }
    .pp .pass { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
    .pp .ago { color: var(--muted); font-size: 12px; }
    .pp .ev { margin-top: 8px; }
    .pp .ev b { font-size: 12.5px; color: var(--muted); }
    .pp .ev ul { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 5px; }
    .pp .ev a { display: inline-block; padding: 3px 10px; border-radius: 14px; background: #eef3ff; color: #1a4fb4;
                text-decoration: none; font-size: 12.5px; border: 1px solid #d6e2ff; }
    .pp .ev a:hover { background: #dfe9ff; }
    .badge { display: inline-block; padding: 1px 9px; border-radius: 10px; color: #fff; font-size: 12.5px; font-weight: 600; }
    .badge.sev-severe { background: var(--severe); } .badge.sev-moderate { background: var(--moderate); }
    .badge.sev-minor { background: var(--minor); color: #3d2b00; } .badge.sev-unknown { background: var(--unknown); }
    .badge.sev-none { background: var(--none); }

    /* ---------- unverified crowd-sourced layer (rayongall.com) ---------- */
    .wu-toggle { display: flex; align-items: center; gap: 7px; margin-top: 6px; font-size: 12.5px; cursor: pointer; user-select: none; }
    .wu-toggle input { width: 16px; height: 16px; margin: 0; accent-color: #607d8b; cursor: pointer; }
    .wu-toggle .wu-n { color: var(--muted); }
    .wu-toggle.is-missing { display: none; }
    .lg .wu-sw { width: 26px; height: 18px; border: 1.5px dashed rgba(211,47,47,.75); background: rgba(211,47,47,.2); border-radius: 3px; }
    .pp .note.wu { background: #f3f4f6; border-color: #90a4ae; }
    .pp .note.wu a { color: #1a4fb4; }
    .pp-head.wu { background: #f7f7f8; border-bottom-style: dashed; }
    #chips { display: none; }
    /* ---------- mobile ---------- */
    @media (max-width: 640px) {
      #panel {
        top: auto; bottom: 0; left: 0; right: 0; width: auto; max-height: 50%;
        border-radius: 14px 14px 0 0; padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
        font-size: 13px;
      }
      #panel h1 { font-size: 15px; }
      .leaflet-bottom .leaflet-control-attribution { margin-bottom: var(--panel-h, 0px); }
      #chips { display: flex; flex-direction: column; gap: 3px; margin-top: 5px; font-size: 12px; }
      #chips .row { display: flex; flex-wrap: wrap; gap: 3px 10px; align-items: center; }
      #chips span { display: inline-flex; align-items: center; gap: 4px; }
      #panel:has(details[open]) #chips { display: none; }
      .leaflet-control-zoom a { width: 36px; height: 36px; line-height: 36px; }
      .lg-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div id="map" role="application" aria-label="แผนที่น้ำท่วมจังหวัดระยอง"></div>

  <section id="panel" aria-label="ข้อมูลแผนที่">
    <h1>🌊 จุดน้ำท่วม จ.ระยอง</h1>
    <div>ข้อมูลล่าสุด: <span id="updated">กำลังโหลด…</span></div>
    <div id="summary"></div>
    <div id="checked"></div>
    <div id="error" role="alert"></div>
    <label class="wu-toggle is-missing" id="wu-toggle-row" title="ข้อมูลจาก rayongall.com ส่งโดยประชาชน ยังไม่ได้ตรวจสอบ">
      <input type="checkbox" id="wu-toggle" checked> <span>รายงานจากประชาชน ยังไม่ยืนยัน <span class="wu-n" id="wu-n"></span></span>
    </label>
    <div id="chips" aria-hidden="true"></div>
    <details id="legend">
      <summary>คำอธิบายสัญลักษณ์</summary>
      <div id="legend-body"></div>
    </details>
    <div class="disclaimer">ข้อมูลรวบรวมจากโพสต์สาธารณะ อาจไม่ครบหรือไม่เป็นปัจจุบัน โปรดตรวจสอบกับหน่วยงานในพื้นที่</div>
  </section>

  <script>
  (function () {
    "use strict";
    var DATA_URL = "rayong_floods.geojson";           // same folder; page must be served over HTTP
    var REFRESH_MS = 5 * 60 * 1000;                     // auto-refresh every 5 minutes
    // Rayong Province bbox (OSM relation 1908812) — see config/settings.json
    var RAYONG_BOUNDS = L.latLngBounds([12.2159732, 100.9844476], [13.1635573, 101.8310549]);
    // mirrors config/settings.json -> marker_colors (unknown = neutral grey)
    var SEV_COLOR = { severe: "#d32f2f", moderate: "#f57c00", minor: "#fbc02d", unknown: "#757575", none: "#388e3c" };
    var SEV_INK = { minor: "#3d2b00" };                 // dark glyph on amber for contrast; white elsewhere
    var SEV_ORDER = ["severe", "moderate", "minor", "unknown", "none"];
    var SEV_TH = { severe: "รุนแรง", moderate: "ปานกลาง", minor: "เล็กน้อย", unknown: "ไม่ทราบ", none: "ไม่มีน้ำท่วม / น้ำลดแล้ว" };
    var SEV_HINT = { severe: "สูงกว่าเข่า / รถผ่านไม่ได้", moderate: "ถึงฟุตบาท–เข่า", minor: "น้ำขังเล็กน้อย", unknown: "ไม่ระบุระดับน้ำ", none: "น้ำลดแล้ว" };
    var PASS_TH = { all_vehicles: "ผ่านได้ทุกประเภท", large_vehicles_only: "รถใหญ่เท่านั้น", impassable: "ผ่านไม่ได้", unknown: "ไม่ทราบ" };
    var PASS_LEGEND = { impassable: "ผ่านไม่ได้ / ปิดถนน", large_vehicles_only: "เฉพาะรถใหญ่ (รถเล็กเลี่ยง)",
                        all_vehicles: "รถผ่านได้ทุกประเภท", unknown: "ยังไม่ทราบว่ารถผ่านได้ไหม" };
    var PASS_ORDER = ["impassable", "large_vehicles_only", "all_vehicles", "unknown"];
    var STATUS_TH = { active: "มีรายงานล่าสุด", stale: "ข้อมูลเก่า (ไม่มีอัปเดตเกิน 24 ชม.)", inactive: "น้ำลดแล้ว" };
    var SHOW_STATUS = { active: true, stale: true };   // never plot needs_review / inactive
    var APPROX_RADIUS_M = { subdistrict: 1500, district: 4000 };
    var APPROX_LABEL = "ตำแหน่งโดยประมาณ (ระดับตำบล/อำเภอ)";
    // separate UNVERIFIED crowd-sourced layer (written by the Mapper from rayongall.com's public flood layer)
    var WEB_URL = "rayong_web_unverified.geojson";      // optional; missing file = layer simply hidden
    var WEB_SITE = "https://74.rayongall.com/ry/flood-map/";
    var WEB_LABEL = "รายงานจากประชาชน (rayongall.com) ยังไม่ยืนยัน";
    var WEB_LEGEND = "รายงานจากประชาชน ยังไม่ยืนยัน";

    var isMobile = window.matchMedia("(max-width: 640px)").matches;
    var legend = document.getElementById("legend");
    if (!isMobile) legend.open = true;

    // ------------------------------------------------------------------
    // Symbol factory: ONE function draws map markers, legend swatches and popup icons
    // ------------------------------------------------------------------
    // passability glyphs, drawn in a 24x24 box (fg = glyph colour, bg = marker colour)
    function glyph(pass, fg, bg) {
      switch (pass) {
        case "impassable":   // no-entry sign
          return '<circle cx="12" cy="12" r="9.6" fill="' + fg + '"/>' +
                 '<rect x="5.4" y="9.9" width="13.2" height="4.2" rx="1.1" fill="' + bg + '"/>';
        case "large_vehicles_only":   // truck
          return '<rect x="1.2" y="5.6" width="13.4" height="10" rx="1.3" fill="' + fg + '"/>' +
                 '<path d="M15.6 8.8h3.8l3.5 4v2.8h-7.3z" fill="' + fg + '"/>' +
                 '<path d="M17.1 10.2h1.8l1.9 2.2h-3.7z" fill="' + bg + '"/>' +
                 '<circle cx="6" cy="17.4" r="2.6" fill="' + fg + '" stroke="' + bg + '" stroke-width="1.4"/>' +
                 '<circle cx="18.3" cy="17.4" r="2.6" fill="' + fg + '" stroke="' + bg + '" stroke-width="1.4"/>';
        case "all_vehicles":   // check mark
          return '<path d="M5 12.6l4.4 4.4L19 7.4" fill="none" stroke="' + fg + '" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>';
        case "blank": return "";
        default:   // water waves = flooding reported, passability unknown
          return '<path d="M2.5 9.3c1.6-1.7 3.1-1.7 4.7 0s3.1 1.7 4.7 0 3.1-1.7 4.7 0 3.1 1.7 4.7 0M2.5 15.3c1.6-1.7 3.1-1.7 4.7 0s3.1 1.7 4.7 0 3.1-1.7 4.7 0 3.1 1.7 4.7 0"' +
                 ' fill="none" stroke="' + fg + '" stroke-width="2.5" stroke-linecap="round"/>';
      }
    }
    var PIN_PATH = "M16 42.6C11.2 35.4 2.6 26.6 2.6 16a13.4 13.4 0 0 1 26.8 0c0 10.6-8.6 19.4-13.4 26.6z";

    /* opts: sev, pass, shape ("pin" exact | "dot" approximate), size (px width), stale, pulse, count, neutral (legend glyph demo) */
    function symbol(o) {
      var sev = SEV_COLOR[o.sev] ? o.sev : "unknown";
      var col = o.neutral ? "#fff" : SEV_COLOR[sev];
      var fg = o.neutral ? "#37474f" : (SEV_INK[sev] || "#fff");
      var outline = o.neutral ? "#37474f" : (o.stale ? "#455a64" : "#fff");
      var dash = o.stale ? ' stroke-dasharray="3.2 2.4"' : "";
      var sw = o.neutral ? 2 : 2.6;
      var w = Math.round(o.size || 30), pin = o.shape === "pin";
      var h = pin ? Math.round(w * 44 / 32) : w;
      var body = pin
        ? '<path d="' + PIN_PATH + '" fill="' + col + '" stroke="' + outline + '" stroke-width="' + sw + '"' + dash + ' stroke-linejoin="round"/>'
        : '<circle cx="16" cy="16" r="13.4" fill="' + col + '" stroke="' + outline + '" stroke-width="' + sw + '"' + dash + '/>';
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 32 ' + (pin ? 44 : 32) + '" aria-hidden="true" focusable="false">' +
                body + '<g transform="translate(16 16) scale(.8) translate(-12 -12)">' + glyph(o.pass, fg, col) + "</g></svg>";
      var head = w * 26.8 / 32, cx = w / 2, cy = w / 2;         // head circle size + centre (same for pin and dot)
      var pulse = o.pulse ? '<span class="rf-pulse" style="left:' + (cx - head / 2) + "px;top:" + (cy - head / 2) + "px;width:" + head + "px;height:" + head + 'px"></span>' : "";
      var cnt = (o.count >= 2) ? '<span class="rf-cnt">' + (o.count > 99 ? "99+" : o.count) + "</span>" : "";
      return { w: w, h: h, pin: pin,
               html: '<span class="rf-mk' + (o.stale ? " is-stale" : "") + '" style="--c:' + SEV_COLOR[sev] + ";width:" + w + "px;height:" + h + 'px">' + pulse + svg + cnt + "</span>" };
    }
    // size grows a little with independent reports: 1 → 100 %, 2 → 110 %, 3–4 → 120 %, 5+ → 130 %
    function sizeFor(n) { n = Number(n) || 1; var base = isMobile ? 34 : 30; return base * (n >= 5 ? 1.3 : n >= 3 ? 1.2 : n >= 2 ? 1.1 : 1); }

    function buildLegend() {
      var h = '<div class="lg-h">สีหมุด = ระดับน้ำท่วม</div><div class="lg-grid">';
      SEV_ORDER.forEach(function (s) {
        h += '<div class="lg" title="' + SEV_HINT[s] + '"><span class="sw">' + symbol({ sev: s, pass: "blank", shape: "dot", size: 20 }).html +
             "</span>" + (s === "none" ? "น้ำลดแล้ว" : SEV_TH[s] + (s === "unknown" ? "ระดับ" : "")) + "</div>";
      });
      h += '</div><div class="lg-h">สัญลักษณ์ในหมุด = การสัญจร</div>';
      PASS_ORDER.forEach(function (p) {
        h += '<div class="lg"><span class="sw">' + symbol({ pass: p, shape: "dot", size: 24, neutral: true }).html + "</span>" + PASS_LEGEND[p] + "</div>";
      });
      h += '<div class="lg-h">รูปแบบหมุด</div>';
      h += '<div class="lg"><span class="sw">' + symbol({ sev: "moderate", pass: "unknown", shape: "pin", size: 21 }).html + "</span>ตำแหน่งชัดเจน (จุด / ช่วงถนน)</div>";
      h += '<div class="lg"><span class="sw"><span class="area">' + symbol({ sev: "unknown", pass: "unknown", shape: "dot", size: 18 }).html +
           "</span></span>ตำแหน่งโดยประมาณ (วงกลมจาง = ระดับตำบล)</div>";
      h += '<div class="lg"><span class="sw">' + symbol({ sev: "severe", pass: "unknown", shape: "dot", size: 18, pulse: true }).html + "</span>วงกระเพื่อม = รุนแรง มีรายงานล่าสุด</div>";
      h += '<div class="lg"><span class="sw">' + symbol({ sev: "moderate", pass: "unknown", shape: "dot", size: 22, stale: true }).html + "</span>จาง + ขอบประ = ข้อมูลเก่า (เกิน 24 ชม.)</div>";
      h += '<div class="lg"><span class="sw">' + symbol({ sev: "minor", pass: "unknown", shape: "dot", size: 20, count: 2 }).html +
           "</span>ตัวเลข = จำนวนรายงานอิสระ (ยิ่งมากหมุดยิ่งใหญ่)</div>";
      h += '<div class="lg-h">ชั้นข้อมูลเพิ่มเติม</div>';
      h += '<div class="lg" title="' + WEB_LABEL + '"><span class="sw"><span class="wu-sw"></span></span>' + WEB_LEGEND +
           " (สีจาง + เส้นประ, อยู่ใต้หมุดที่ยืนยันแล้ว)</div>";
      byId("legend-body").innerHTML = h;
      // compact chips for the mobile bottom sheet (visible while the legend is closed)
      var c = '<div class="row">';
      SEV_ORDER.forEach(function (s) { c += '<span><i class="dot" style="background:' + SEV_COLOR[s] + '"></i>' + (s === "none" ? "น้ำลด" : SEV_TH[s]) + "</span>"; });
      c += '</div><div class="row">';
      PASS_ORDER.forEach(function (p) {
        c += "<span>" + symbol({ pass: p, shape: "dot", size: 18, neutral: true }).html +
             ({ impassable: "ผ่านไม่ได้", large_vehicles_only: "รถใหญ่", all_vehicles: "ผ่านได้", unknown: "ไม่ทราบ" })[p] + "</span>";
      });
      byId("chips").innerHTML = c + "</div>";
    }

    var map = L.map("map", { zoomControl: true, tap: true, preferCanvas: false });
    map.fitBounds(RAYONG_BOUNDS);
    var tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
    });
    // add OSM tiles only once the first view is settled, so we don't request (and then abort) province-view tiles
    function addTiles() { if (!map.hasLayer(tiles)) tiles.addTo(map); }
    setTimeout(addTiles, 4000);
    map.createPane("approx"); map.getPane("approx").style.zIndex = 380; map.getPane("approx").style.pointerEvents = "none";   // approximate-area circles: bottom-most and click-through, so smaller areas inside stay clickable (the centre dot keeps the popup)
    map.createPane("webUnverified"); map.getPane("webUnverified").style.zIndex = 390;   // unverified layer BELOW everything verified

    var layer = L.layerGroup().addTo(map);
    var firstFitDone = false;
    var els = { updated: byId("updated"), summary: byId("summary"), checked: byId("checked"), error: byId("error") };
    window.RF = { rendered: 0, lastLoad: null, errors: [], map: map,   // simple status hook (used by tests)
                  webRendered: 0, webLoaded: false, webErrors: [] };

    function byId(id) { return document.getElementById(id); }
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function fmtBkk(iso) {
      if (!iso) return "-";
      var d = new Date(iso);
      if (isNaN(d)) return String(iso);
      return d.toLocaleString("th-TH", { timeZone: "Asia/Bangkok", day: "numeric", month: "short", year: "numeric",
                                         hour: "2-digit", minute: "2-digit", hour12: false }) + " น.";
    }
    function ago(iso) {
      var t = Date.parse(iso); if (isNaN(t)) return "";
      var m = Math.round((Date.now() - t) / 60000);
      if (m < 1) return "เมื่อสักครู่";
      if (m < 60) return m + " นาทีที่แล้ว";
      if (m < 48 * 60) return Math.floor(m / 60) + " ชม. ที่แล้ว";
      return Math.floor(m / 1440) + " วันที่แล้ว";
    }
    function isPrivate(p) {
      return p.private_group === true || p.evidence_visibility === "private_only" ||
             p.source_privacy === "private" || p.is_private === true;
    }
    function publicLinks(p) {
      if (isPrivate(p)) return [];
      var urls = Array.isArray(p.evidence_urls) ? p.evidence_urls : [];
      return urls.filter(function (u) {
        if (!/^https?:\/\//i.test(u || "")) return false;
        // defence in depth: if any evidence was private, never show group URLs
        if (p.evidence_visibility && p.evidence_visibility !== "public" && /facebook\.com\/groups\//i.test(u)) return false;
        return true;
      });
    }
    function hostLabel(u) {
      try {
        var h = new URL(u).hostname.replace(/^www\.|^m\./, "");
        if (/facebook\.com$|fb\.watch$/.test(h)) return "Facebook";
        if (/(^|\.)x\.com$|twitter\.com$/.test(h)) return "X (Twitter)";
        return h;
      } catch (e) { return "ลิงก์"; }
    }

    function popupHtml(p, approx) {
      var sev = SEV_TH[p.severity] ? p.severity : "unknown";
      var pass = PASS_TH[p.passability] ? p.passability : "unknown";
      var stale = p.status === "stale";
      var links = publicLinks(p);
      var h = '<div class="pp">';
      h += '<div class="pp-head" style="--c:' + SEV_COLOR[sev] + '">' +
           symbol({ sev: sev, pass: pass, shape: approx ? "dot" : "pin", size: 26, stale: stale }).html +
           "<div><h3>" + esc(p.title || "จุดน้ำท่วม") + "</h3>" +
           (p.location_text ? '<div class="loc">📍 ' + esc(p.location_text) + "</div>" : "") + "</div></div>";
      h += '<div class="pp-body">';
      if (approx) h += '<div class="note">' + APPROX_LABEL + "</div>";
      if (stale) h += '<div class="note stale">' + STATUS_TH.stale + "</div>";
      h += "<table>";
      h += '<tr><th>ความรุนแรง</th><td><span class="badge sev-' + sev + '">' + esc(SEV_TH[sev]) + "</span></td></tr>";
      h += '<tr><th>รถผ่านได้ไหม</th><td><span class="pass">' + symbol({ pass: pass, shape: "dot", size: 20, neutral: true }).html +
           esc(PASS_TH[pass]) + "</span></td></tr>";
      h += "<tr><th>อัปเดตล่าสุด</th><td>" + esc(fmtBkk(p.last_reported_at)) +
           (p.last_reported_at ? ' <span class="ago">(' + esc(ago(p.last_reported_at)) + ")</span>" : "") + "</td></tr>";
      h += "<tr><th>รายงานอิสระ</th><td>" + esc(Number(p.independent_report_count) || 0) + " รายงาน</td></tr>";
      h += "</table>";
      if (isPrivate(p)) {
        h += '<div class="note priv" style="margin-top:8px">ข้อมูลนี้มาจากกลุ่มส่วนตัว จึงแสดงเฉพาะข้อเท็จจริง ไม่แสดงลิงก์หรือข้อความต้นทาง</div>';
      } else if (links.length) {
        h += '<div class="ev"><b>หลักฐาน:</b><ul>';
        links.forEach(function (u, i) {
          h += '<li><a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer nofollow">' +
               esc(hostLabel(u)) + " โพสต์ที่ " + (i + 1) + " ↗</a></li>";
        });
        h += "</ul></div>";
        if (p.evidence_visibility === "mixed") h += '<div class="note priv" style="margin-top:6px">หลักฐานบางส่วนมาจากกลุ่มส่วนตัว จึงไม่แสดงลิงก์ส่วนนั้น</div>';
      } else {
        h += '<div class="ev"><b>หลักฐาน:</b> -</div>';
      }
      h += "</div></div>";
      return h;
    }

    function render(gj) {
      var feats = (gj && Array.isArray(gj.features)) ? gj.features : [];
      var newLayer = L.layerGroup();
      var bounds = L.latLngBounds([]);
      var n = 0, nActive = 0, nStale = 0;
      feats.forEach(function (f) {
        var p = (f && f.properties) || {};
        if (!SHOW_STATUS[p.status]) return;                       // only active + stale
        if (!f.geometry || f.geometry.type !== "Point") return;
        var c = f.geometry.coordinates, lon = +c[0], lat = +c[1];  // RFC 7946 = [lon, lat]
        if (!isFinite(lat) || !isFinite(lon)) return;
        var ll = L.latLng(lat, lon);
        var sev = SEV_COLOR[p.severity] ? p.severity : "unknown";
        var pass = PASS_TH[p.passability] ? p.passability : "unknown";
        var stale = p.status === "stale" || p.status === "inactive";
        var imp = pass === "impassable";
        var approx = Object.prototype.hasOwnProperty.call(APPROX_RADIUS_M, p.precision);
        var popOpts = { maxWidth: Math.min(330, window.innerWidth - 40), minWidth: Math.min(250, window.innerWidth - 60),
                        autoPanPadding: [20, 20], className: "rf-popup" };
        var html = popupHtml(p, approx);
        if (approx) {   // soft, low-opacity area behind the marker: location is approximate
          var area = L.circle(ll, {
            pane: "approx", radius: APPROX_RADIUS_M[p.precision],
            color: SEV_COLOR[sev], weight: 1.5, opacity: stale ? 0.35 : 0.6, dashArray: "4 6",
            fillColor: SEV_COLOR[sev], fillOpacity: stale ? 0.06 : 0.13, interactive: false
          });
          newLayer.addLayer(area);
          bounds.extend(area.getLatLng().toBounds(APPROX_RADIUS_M[p.precision] * 2));
        } else {
          bounds.extend(ll);
        }
        var sym = symbol({ sev: sev, pass: pass, shape: approx ? "dot" : "pin", size: sizeFor(p.independent_report_count),
                           stale: stale, pulse: sev === "severe" && p.status === "active",
                           count: Number(p.independent_report_count) || 0 });
        var obj = L.marker(ll, {
          icon: L.divIcon({ className: "rf-icon", html: sym.html, iconSize: [sym.w, sym.h],
                            iconAnchor: sym.pin ? [sym.w / 2, sym.h * 42.6 / 44] : [sym.w / 2, sym.h / 2],
                            popupAnchor: [0, sym.pin ? -sym.h * 0.9 : -sym.h / 2] }),
          title: p.title || "", alt: p.title || "", keyboard: true, riseOnHover: true,
          zIndexOffset: stale ? -1000 : (imp ? 1000 : (sev === "severe" ? 500 : 0))
        });
        obj.bindPopup(html, popOpts);
        newLayer.addLayer(obj);
        n++; if (stale) nStale++; else nActive++;
      });
      map.removeLayer(layer); layer = newLayer.addTo(map);

      window.RF.rendered = n;
      syncPanel();
      document.body.setAttribute("data-rendered", String(n));
      els.updated.textContent = fmtBkk(gj.generated_at);
      els.summary.textContent = n
        ? "แสดง " + n + " จุด (ล่าสุด " + nActive + " · ข้อมูลเก่า " + nStale + ")"
        : "ยังไม่มีจุดน้ำท่วมที่ยืนยันตำแหน่งได้";
      if (!firstFitDone) {
        firstFitDone = true;
        if (n && bounds.isValid()) {
          map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14, animate: false,
                                  paddingBottomRight: isMobile ? [0, byId("panel").offsetHeight] : [0, 0] });
        }
        addTiles();
      }
    }

    // ------------------------------------------------------------------
    // Unverified crowd-sourced layer (separate from verified incidents; never merged)
    // ------------------------------------------------------------------
    function muted(hex) {   // same palette as verified markers, blended 35 % toward grey
      var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || "");
      if (!m) return "#9e9e9e";
      return "#" + [1, 2, 3].map(function (i) {
        var v = Math.round(parseInt(m[i], 16) * 0.65 + 158 * 0.35);
        return (v < 16 ? "0" : "") + v.toString(16);
      }).join("");
    }
    var SEV_MUTED = {};
    Object.keys(SEV_COLOR).forEach(function (k) { SEV_MUTED[k] = muted(SEV_COLOR[k]); });
    var webLayer = null, webWanted = true;
    var webToggle = byId("wu-toggle"), webRow = byId("wu-toggle-row"), webCount = byId("wu-n");
    webToggle.addEventListener("change", function () {
      webWanted = webToggle.checked;
      if (!webLayer) return;
      if (webWanted) webLayer.addTo(map); else map.removeLayer(webLayer);
    });
    function webTitle(p) {
      var t = p.title;
      if (Array.isArray(t)) t = t.filter(function (x) { return typeof x === "string" && x.trim(); })[0];
      return (typeof t === "string" && t.trim()) ? t.trim() : "จุดน้ำท่วม (ไม่ระบุชื่อ)";
    }
    function webPopupHtml(p) {
      var sev = SEV_COLOR[p.severity] ? p.severity : "unknown";
      var pass = PASS_TH[p.passability] ? p.passability : "unknown";
      var d = (typeof p.depth_cm === "number" && isFinite(p.depth_cm)) ? p.depth_cm + " ซม." : "ไม่ระบุ";
      var h = '<div class="pp">';
      h += '<div class="pp-head wu" style="--c:' + SEV_MUTED[sev] + '"><div><h3>' + esc(webTitle(p)) + "</h3>" +
           (p.district ? '<div class="loc">อ.' + esc(p.district) + "</div>" : "") + "</div></div>";
      h += '<div class="pp-body"><table>';
      h += "<tr><th>ความลึก (cm)</th><td>" + esc(d) + "</td></tr>";
      h += "<tr><th>สถานะถนน</th><td>" + esc(PASS_TH[pass]) + "</td></tr>";
      h += "<tr><th>เวลารายงานล่าสุด (ICT)</th><td>" + esc(fmtBkk(p.last_reported_at)) +
           (p.last_reported_at ? ' <span class="ago">(' + esc(ago(p.last_reported_at)) + ")</span>" : "") + "</td></tr>";
      h += "</table>";
      h += '<div class="note wu" style="margin-top:8px">' + esc(WEB_LABEL) + '<br><a href="' + WEB_SITE +
           '" target="_blank" rel="noopener noreferrer nofollow">ดูแผนที่ต้นทาง rayongall.com ↗</a></div>';
      h += "</div></div>";
      return h;
    }
    function webStyle(f) {
      var p = (f && f.properties) || {};
      var c = SEV_MUTED[SEV_COLOR[p.severity] ? p.severity : "unknown"];
      var t = f && f.geometry && f.geometry.type;
      if (t === "LineString") return { pane: "webUnverified", color: c, weight: 2, opacity: 0.8, dashArray: "5 5", lineCap: "butt" };
      return { pane: "webUnverified", color: c, weight: 1.5, opacity: 0.75, dashArray: "4 4", fillColor: c, fillOpacity: 0.2 };
    }
    function renderWeb(gj) {
      var n = 0;
      var feats = (gj && Array.isArray(gj.features)) ? gj.features.filter(function (f) {
        var p = (f && f.properties) || {};
        var t = f && f.geometry && f.geometry.type;
        return p.layer === "web_unverified" && (t === "Point" || t === "LineString" || t === "Polygon");
      }) : [];
      var popOpts = { maxWidth: Math.min(330, window.innerWidth - 40), minWidth: Math.min(240, window.innerWidth - 60),
                      autoPanPadding: [20, 20], className: "rf-popup" };
      var newLayer = L.geoJSON({ type: "FeatureCollection", features: feats }, {
        pane: "webUnverified",
        attribution: 'รายงานจากประชาชน: <a href="' + WEB_SITE + '" target="_blank" rel="noopener">rayongall.com</a> (ยังไม่ยืนยัน)',
        style: webStyle,
        pointToLayer: function (f, ll) {   // small hollow, faded circle
          var s = webStyle(f);
          return L.circleMarker(ll, { pane: "webUnverified", radius: isMobile ? 6 : 5, color: s.color, weight: 1.5,
                                      opacity: 0.85, fillColor: s.color, fillOpacity: 0.2, dashArray: "2 2" });
        },
        onEachFeature: function (f, lyr) {
          n++;
          lyr.bindPopup(webPopupHtml(f.properties || {}), popOpts);
          lyr.bindTooltip(esc(webTitle(f.properties || {})) + " · ยังไม่ยืนยัน", { sticky: true, direction: "top", opacity: 0.9 });
        }
      });
      if (webLayer) map.removeLayer(webLayer);
      webLayer = newLayer;
      if (webWanted) webLayer.addTo(map);
      window.RF.webRendered = n; window.RF.webLoaded = true;
      webCount.textContent = "(" + n + ")";
      webRow.classList.remove("is-missing");
      syncPanel();
    }
    function loadWeb() {
      return fetch(WEB_URL + "?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(renderWeb)
        .catch(function (e) {   // optional layer: fail quietly, keep the last good copy if any
          window.RF.webErrors.push(String(e));
          if (!webLayer) { webRow.classList.add("is-missing"); window.RF.webRendered = 0; }
        });
    }

    function load() {
      if (location.protocol === "file:") {
        addTiles();
        showError("กรุณาเปิดหน้านี้ผ่าน HTTP (เช่น python3 -m http.server) เบราว์เซอร์ไม่อนุญาตให้โหลดข้อมูลจากไฟล์โดยตรง");
        return Promise.resolve();
      }
      loadWeb();   // independent of the verified layer; its failure never affects verified markers
      return fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (gj) {
          render(gj);
          window.RF.lastLoad = new Date().toISOString();
          els.checked.textContent = "ตรวจสอบข้อมูลใหม่เมื่อ " + fmtBkk(window.RF.lastLoad) + " · อัปเดตอัตโนมัติทุก 5 นาที";
          els.error.style.display = "none";
        })
        .catch(function (e) {
          window.RF.errors.push(String(e)); addTiles();
          showError("โหลดข้อมูลไม่สำเร็จ (" + e.message + ") จะลองใหม่อัตโนมัติ");
        });
    }
    function showError(msg) { els.error.textContent = msg; els.error.style.display = "block"; }

    buildLegend();
    load();
    var lastTick = Date.now();
    setInterval(function () { lastTick = Date.now(); load(); }, REFRESH_MS);
    // phones pause timers in background tabs: refresh when the page becomes visible again and data is old
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible" && Date.now() - lastTick > REFRESH_MS) { lastTick = Date.now(); load(); }
    });
    // keep the attribution visible above the mobile bottom sheet
    function syncPanel() { document.documentElement.style.setProperty("--panel-h", byId("panel").offsetHeight + "px"); }
    legend.addEventListener("toggle", syncPanel); window.addEventListener("resize", syncPanel); syncPanel();
    if (window.ResizeObserver) new ResizeObserver(syncPanel).observe(byId("panel"));
  })();
  </script>
</body>
</html>
